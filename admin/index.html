<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Faiz Admin</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><style>body{font-family:Arial;margin:0;background:#fff5dc;color:#222}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 3px 12px #0002}input,button{padding:12px;border-radius:10px;border:1px solid #ddd;margin:5px}button{background:#f4511e;color:white;border:0;font-weight:bold}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.danger{background:#444}</style></head><body><div class="wrap"><h1>🍔 Al-Faiz Admin</h1><div id="login" class="card"><h2>Admin Login</h2><input id="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p id="msg"></p></div><div id="app" style="display:none"><div class="card"><h2>Restaurant settings</h2><div class="row"><input id="wa" placeholder="WhatsApp number"><input id="fee" type="number" placeholder="Delivery fee"></div><button onclick="saveSettings()">SAVE SETTINGS</button></div><div class="card"><h2>Menu</h2><button onclick="addItem()">+ ADD ITEM</button><div id="items"></div></div><button class="danger" onclick="logout()">LOG OUT</button></div></div><script>const firebaseConfig={apiKey:"AIzaSyBPNkTzqNuFWH4ONSfIjiAHJsMOMfreXbQ",authDomain:"adeel-bc3e9.firebaseapp.com",databaseURL:"https://adeel-bc3e9-default-rtdb.firebaseio.com",projectId:"adeel-bc3e9"};firebase.initializeApp(firebaseConfig);const db=firebase.database();function login(){firebase.auth().signInWithEmailAndPassword(email.value,pass.value).catch(e=>msg.textContent=e.message)}firebase.auth().onAuthStateChanged(u=>{login.style.display=u?"none":"block";app.style.display=u?"block":"none";if(u)load()});function load(){db.ref("settings").once("value",s=>{let x=s.val()||{};wa.value=x.whatsapp||"";fee.value=x.deliveryFee||0});db.ref("menu").on("value",s=>{items.innerHTML="";Object.entries(s.val()||{}).forEach(([id,x])=>{let d=document.createElement("div");d.className="row";d.innerHTML='<input value="'+x.name.replace(/"/g,'&quot;')+'"><input type="number" value="'+x.price+'"><button>SAVE</button><button class="danger">X</button>';let ins=d.querySelectorAll("input");d.children[2].onclick=()=>db.ref("menu/"+id).update({name:ins[0].value,price:Number(ins[1].value)});d.children[3].onclick=()=>db.ref("menu/"+id).remove();items.appendChild(d)})})}function saveSettings(){db.ref("settings").update({whatsapp:wa.value,deliveryFee:Number(fee.value)}).then(()=>alert("Saved"))}function addItem(){let name=prompt("Item name");if(!name)return;let category=prompt("Category","Burgers")||"Other";let price=Number(prompt("Price","0"));db.ref("menu").push({name,category,price,enabled:true})}function logout(){firebase.auth().signOut()}</script></body></html>
