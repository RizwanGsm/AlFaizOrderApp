<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Faiz Admin</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><style>body{font-family:Arial;margin:0;background:#fff5dc;color:#222}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 3px 12px #0002}input,button,select{box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #ddd;margin:4px}button{background:#f4511e;color:#fff;border:0;font-weight:bold;cursor:pointer}.danger{background:#444}.muted{color:#666}.item{display:grid;grid-template-columns:1.5fr 1fr 1fr 90px 80px;gap:5px;align-items:center;margin:7px 0}.item input,.item select{width:100%}@media(max-width:700px){.item{grid-template-columns:1fr 1fr}.item button{width:100%}}</style></head><body><div class="wrap"><h1>🍔 Al-Faiz Fast Food Admin</h1><div id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p id="msg"></p></div><div id="app" style="display:none"><div class="card"><h2>Restaurant Settings</h2><input id="restaurant" placeholder="Restaurant name"><input id="wa" placeholder="WhatsApp number"><input id="fee" type="number" placeholder="Delivery fee"><button onclick="saveSettings()">SAVE SETTINGS</button></div><div class="card"><h2>Menu Management</h2><button onclick="addItem()">+ ADD ITEM</button><span class="muted"> Changes appear in the customer app after its next online refresh.</span><div id="items"></div></div><button class="danger" onclick="logout()">LOG OUT</button></div></div><script>const firebaseConfig={apiKey:"AIzaSyBPNkTzqNuFWH4ONSfIjiAHJsMOMfreXbQ",authDomain:"adeel-bc3e9.firebaseapp.com",databaseURL:"https://adeel-bc3e9-default-rtdb.firebaseio.com",projectId:"adeel-bc3e9"};firebase.initializeApp(firebaseConfig);const db=firebase.database();function login(){firebase.auth().signInWithEmailAndPassword(email.value.trim(),pass.value).catch(e=>msg.textContent=e.message)}firebase.auth().onAuthStateChanged(u=>{document.getElementById("login").style.display=u?"none":"block";document.getElementById("app").style.display=u?"block":"none";if(u)load()});function load(){db.ref("settings").on("value",s=>{let x=s.val()||{};restaurant.value=x.restaurantName||"Al-Faiz Fast Food";wa.value=x.whatsapp||"";fee.value=x.deliveryFee||0});db.ref("menu").on("value",s=>{items.innerHTML="";Object.entries(s.val()||{}).forEach(([id,x])=>row(id,x))})}function row(id,x){let d=document.createElement("div");d.className="item";let n=document.createElement("input"),c=document.createElement("input"),p=document.createElement("input"),e=document.createElement("select");n.value=x.name||"";c.value=x.category||"Other";p.type="number";p.value=x.price||0;e.innerHTML="<option value='true'>Enabled</option><option value='false'>Hidden</option>";e.value=String(x.enabled!==false);let s=document.createElement("button");s.textContent="SAVE";s.onclick=()=>db.ref("menu/"+id).update({name:n.value,category:c.value,price:Number(p.value),enabled:e.value==="true"});let del=document.createElement("button");del.textContent="DELETE";del.className="danger";del.onclick=()=>{if(confirm("Delete "+n.value+"?"))db.ref("menu/"+id).remove()};d.append(n,c,p,e,s,del);items.appendChild(d)}function saveSettings(){db.ref("settings").update({restaurantName:restaurant.value,whatsapp:wa.value.replace(/\\D/g,""),deliveryFee:Number(fee.value)||0}).then(()=>alert("Settings saved"))}function addItem(){let name=prompt("Item name");if(!name)return;let category=prompt("Category","Burgers")||"Other";let price=Number(prompt("Price","0"))||0;db.ref("menu").push({name,category,price,enabled:true}).then(()=>alert("Item added"))}function logout(){firebase.auth().signOut()}</script></body></html>
