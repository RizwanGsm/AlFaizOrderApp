<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Faiz Admin</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><style>body{font-family:Arial;margin:0;background:#fff5dc;color:#222}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 3px 12px #0002}input,button,select{box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #ddd;margin:4px}button{background:#f4511e;color:#fff;border:0;font-weight:bold;cursor:pointer}.danger{background:#444}.muted{color:#666}.item{display:grid;grid-template-columns:1.25fr 1fr 80px 1.7fr 90px 80px;gap:5px;align-items:center;margin:7px 0}.item input,.item select{width:100%}@media(max-width:700px){.item{grid-template-columns:1fr 1fr}.item button{width:100%}}</style></head><body><div class="wrap"><h1>🍔 Al-Faiz Fast Food Admin</h1><div id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p id="msg"></p></div><div id="app" style="display:none"><div class="card"><h2>Restaurant Settings</h2><input id="restaurant" placeholder="Restaurant name"><input id="wa" placeholder="WhatsApp number"><button onclick="saveSettings()">SAVE SETTINGS</button></div><div class="card"><h2>Menu Management</h2><button onclick="addItem()">+ ADD ITEM</button><button onclick="addStandardDeals()">LOAD DEALS 1-20</button><span class="muted"> Changes appear in the customer app after its next online refresh.</span><div id="items"></div></div><button class="danger" onclick="logout()">LOG OUT</button></div></div><script>const firebaseConfig={apiKey:"AIzaSyBPNkTzqNuFWH4ONSfIjiAHJsMOMfreXbQ",authDomain:"adeel-bc3e9.firebaseapp.com",databaseURL:"https://adeel-bc3e9-default-rtdb.firebaseio.com",projectId:"adeel-bc3e9"};firebase.initializeApp(firebaseConfig);const db=firebase.database();function login(){firebase.auth().signInWithEmailAndPassword(email.value.trim(),pass.value).catch(e=>msg.textContent=e.message)}firebase.auth().onAuthStateChanged(u=>{document.getElementById("login").style.display=u?"none":"block";document.getElementById("app").style.display=u?"block":"none";if(u)load()});function load(){db.ref("settings").on("value",s=>{let x=s.val()||{};restaurant.value=x.restaurantName||"Al-Faiz Fast Food";wa.value=x.whatsapp||""});db.ref("menu").on("value",s=>{items.innerHTML="";Object.entries(s.val()||{}).forEach(([id,x])=>row(id,x))})}function row(id,x){let d=document.createElement("div");d.className="item";let n=document.createElement("input"),c=document.createElement("input"),p=document.createElement("input"),d=document.createElement("input"),e=document.createElement("select");n.value=x.name||"";c.value=x.category||"Other";p.type="number";p.value=x.price||0;d.placeholder="Deal contents / description";d.value=x.details||"";e.innerHTML="<option value='true'>Enabled</option><option value='false'>Hidden</option>";e.value=String(x.enabled!==false);let s=document.createElement("button");s.textContent="SAVE";s.onclick=()=>db.ref("menu/"+id).update({name:n.value,category:c.value,price:Number(p.value),details:d.value,enabled:e.value==="true"});let del=document.createElement("button");del.textContent="DELETE";del.className="danger";del.onclick=()=>{if(confirm("Delete "+n.value+"?"))db.ref("menu/"+id).remove()};d.append(n,c,p,d,e,s,del);items.appendChild(d)}function saveSettings(){db.ref("settings").update({restaurantName:restaurant.value,whatsapp:wa.value.replace(/\\D/g,"")}).then(()=>alert("Settings saved"))}function addItem(){let name=prompt("Item name");if(!name)return;let category=prompt("Category","Burgers")||"Other";let price=Number(prompt("Price","0"))||0;let details=prompt("Contents / description (optional)","")||"";db.ref("menu").push({name,category,price,details,enabled:true}).then(()=>alert("Item added"))}function logout(){firebase.auth().signOut()}const STANDARD_DEALS=[["Deal 1",1200,"Includes: 3 Small Pizzas • 1 Liter Bottle"],["Deal 2",1500,"Includes: 1 Medium Pizza • 6 Nuggets • ½ Liter Bottle"],["Deal 3",1800,"Includes: 2 Medium Pizzas • 1 Liter Bottle"],["Deal 4",2800,"Includes: 2 Large Pizzas • 1½ Liter Bottle"],["Deal 5",3700,"Includes: 1 Large Pizza • 1 XL Pizza • 2 Liter Bottles"],["Deal 6",1250,"Includes: 1 Regular Fries • 6 Hot Wings • 2 Zinger Burgers • 1 Liter Bottle"],["Deal 7",1150,"Includes: 1 Small Pizza • 1 Pasta • 6 Hot Wings • 1 Liter Bottle"],["Deal 8",2350,"Includes: 1 Large Special Pizza • 2 Zinger Burgers • 2 Chicken Shawarma • 1 Liter Bottle"],["Deal 9",1100,"Includes: 4 Anda Shami Burgers • 4 Chicken Shawarma • 1 Liter Bottle"],["Deal 10",1100,"Includes: 2 Shawarma • 2 Chicken Shawarma • 6 Nuggets • 1 Liter Bottle"],["Deal 11",2090,"Includes: 7 Chicken Shawarma • 1 Medium Pizza • 1½ Liter Bottle"],["Deal 12",1500,"Includes: 1 Full Pasta • 1 Regular Fries • 1 Spring Roll • ½ Liter Bottle"],["Deal 13",750,"Includes: 1 Chicken Roll • 6 Hot Wings • ½ Liter Bottle"],["Deal 14",900,"Includes: 1 Small Pizza • 1 Full Pasta • ½ Liter Bottle"],["Deal 15",950,"Includes: 2 Small Pizzas • 1 Liter Bottle"],["Deal 16",1400,"Includes: 1 Medium Pizza • 1 Spring Roll • 1 Liter Bottle"],["Deal 17",1350,"Includes: 1 BBQ Roll • 1 Malai Boti Roll • ½ Pasta • 1 Liter Bottle"],["Deal 18",600,"Includes: 1 Zinger Burger • 1 Peti Burger • ½ Liter Bottle"],["Deal 19",1350,"Includes: 1 Small Pizza • 1 Special Roll • 1 Small Pasta • 1 Liter Bottle"],["Deal 20",900,"Includes: 2 Full Pasta • ½ Liter Bottle"]];function addStandardDeals(){if(!confirm("Load/update Deal 1-20 in Firebase?"))return;const jobs={};STANDARD_DEALS.forEach(([name,price,details])=>{const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"_");jobs["menu/"+id]={name,category:"Deals",price,details,enabled:true}});db.ref().update(jobs).then(()=>alert("Deals 1-20 loaded into Firebase")).catch(e=>alert(e.message))}</script></body></html>
